<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/schedule/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SYN — Schedule Drawings</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@400;500;700;900&family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <script type="text/javascript">
      // GitHub Pages SPA fallback restorer (rafgraph/spa-github-pages)
      // 404.html bounces deep links to /?/path, here we restore the original URL
      // via history.replaceState so React Router can route normally.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
